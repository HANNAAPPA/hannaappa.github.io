<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="따라 말하기">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>따라 말하기</title>
<script src="shim.js"></script>
<style>header{padding-top:env(safe-area-inset-top)}body{padding-bottom:env(safe-area-inset-bottom)}</style>
<style>
:root{--bg:#f4f6f9;--card:#fff;--line:#e5e8ee;--muted:#8a93a3;--txt:#1f2733;--blue:#2563eb;--green:#0f9d58;--red:#e5484d;--gray:#9aa3b2;--pink:#ec4899;--once:#7c3aed;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);z-index:5;}
.hd{padding:12px 18px 0;display:flex;align-items:center;gap:12px;}
.hd h1{font-size:18px;margin:0;}
.hd .today{color:var(--muted);font-size:13px;}
.hd button.rf{margin-left:auto;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;}
.hd button.rf:disabled{opacity:.5;cursor:default;}
.tabs{display:flex;gap:2px;padding:0 10px;overflow-x:auto;}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-size:15px;color:var(--muted);cursor:pointer;white-space:nowrap;}
.tab.on{color:var(--txt);border-bottom-color:var(--blue);font-weight:700;}
.wrap{max-width:1100px;margin:0 auto;padding:18px;}
.wrap:has(#pane-home.on){max-width:1440px;}
.wrap.wide{max-width:1460px;padding:18px 14px;}   /* 🌏 여행 3단 — 좌우 여백을 줄인다 */
.state{padding:40px;text-align:center;color:var(--muted);}
.pane{display:none;}
.pane.on{display:block;}
.empty{color:var(--muted);font-size:14px;}
h3{font-size:15px;margin:0 0 12px;}


.eg-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.eg-star{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px 14px;font-size:15px}
.eg-star b{font-size:22px;color:#ea580c}
.eg-week{display:flex;gap:6px}
.eg-week span{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px}
.eg-week i{font-style:normal;font-size:18px}
.eg-add{display:flex;gap:8px;margin-bottom:14px}
.eg-add input{flex:1;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px}
.eg-add button,.eg-btn{border:none;background:#2563eb;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer}
.eg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.eg-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;transition:transform .1s}
.eg-card:active{transform:scale(.97)}
.eg-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#e5e7eb}
.eg-card .play{position:absolute;top:0;left:0;right:0;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;pointer-events:none}
.eg-card .play span{width:42px;height:42px;border-radius:50%;background:rgba(15,23,42,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;padding-left:2px}
.eg-card .t{padding:8px 10px 2px;font-size:13px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.eg-card .s{padding:0 10px 9px;font-size:11.5px;color:var(--muted)}
.eg-card .s .new{color:#2563eb;font-weight:700}
.eg-card .x{position:absolute;top:6px;right:6px;border:none;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:26px;height:26px;cursor:pointer}
.eg-tip{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 12px;font-size:13px;color:#1e3a8a;margin-bottom:12px;line-height:1.55}
.eg-pw-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;background:#000;font-size:13px;z-index:2;text-align:center;padding:16px}
.eg-spin{width:32px;height:32px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:egSpin .8s linear infinite}
@keyframes egSpin{to{transform:rotate(360deg)}}
.eg-back{border:none;background:none;color:#2563eb;font-size:14px;cursor:pointer;padding:4px 0;margin-bottom:6px}
.eg-pw{position:relative;width:100%;max-width:820px;margin:0 auto;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.eg-pw iframe,.eg-pw #egPlayer{position:absolute;inset:0;width:100%;height:100%}
.eg-modes{display:flex;gap:6px;margin:12px auto;max-width:820px;flex-wrap:wrap}
.eg-modes button{flex:1;min-width:90px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 6px;font-size:14px;font-weight:700;cursor:pointer}
.eg-modes button.on{background:#1f2733;color:#fff;border-color:#1f2733}
.eg-panel{max-width:820px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.eg-opts{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13.5px;margin-bottom:12px;align-items:center}
.eg-opts label{display:flex;align-items:center;gap:5px}
.eg-chip{display:inline-flex;gap:4px}
.eg-chip button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.eg-chip button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.eg-go{width:100%;font-size:20px;padding:16px;border-radius:14px;border:none;background:#16a34a;color:#fff;font-weight:800;cursor:pointer}
.eg-cut{width:100%;font-size:19px;padding:16px;border-radius:14px;border:none;background:#ea580c;color:#fff;font-weight:800;cursor:pointer;margin-bottom:10px}
.eg-segs{max-height:340px;overflow:auto;margin-top:8px}
.eg-seg{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.eg-seg.on{background:#eff6ff}
.eg-seg .tm{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:86px}
.eg-seg input{flex:1;min-width:0;padding:6px 8px;border:1px solid #e2e8f0;border-radius:7px;font-size:13px}
.eg-seg button{border:1px solid #e2e8f0;background:#fff;border-radius:7px;padding:5px 7px;font-size:12px;cursor:pointer}
.eg-seg .tx{flex:1;cursor:pointer;white-space:normal;overflow-wrap:anywhere;line-height:1.4}
.eg-seg input{min-width:0;text-overflow:clip}
.eg-segs{max-height:min(440px,55vh)}
.eg-note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
.eg-roadmap-btn{width:100%;text-align:left;border:1px solid #bfdbfe;background:#eff6ff;color:#1e3a8a;
.eg-rd-intro{margin-bottom:14px}
.eg-rd-intro h3{margin:0 0 8px;font-size:18px}
.eg-rd-intro p{font-size:13.5px;line-height:1.7;color:var(--txt);margin:0 0 8px}
.eg-rd-note{background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:8px 11px;font-size:12.5px;color:#92400e}
.eg-rd-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.eg-rd-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.eg-rd-emoji{font-size:26px;flex:none}
.eg-rd-name{font-size:15px;font-weight:800}
.eg-rd-when{font-size:12px;color:var(--muted)}
.eg-rd-goal{font-size:13.5px;line-height:1.65;margin:0 0 8px}
.eg-rd-pts{margin:0 0 10px;padding-left:18px;font-size:13px;line-height:1.6;color:#475569}
.eg-rd-pts li{margin-bottom:3px}
.eg-rd-empty{font-size:12.5px;color:var(--muted);background:#f8fafc;border-radius:9px;padding:9px 11px;line-height:1.6;margin-bottom:10px}
.eg-rd-add{display:flex;gap:6px}
.eg-rd-add input{flex:1;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px}
.eg-rd-add button{border:none;background:#475569;color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.eg-vrows{margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.eg-vrow{display:flex;gap:10px;padding:10px;border:2px solid #93c5fd;border-radius:12px;background:#fff}
.eg-vrow.fam{border:2px solid #86efac;background:#f0fdf4}
.eg-vrow img{width:96px;height:54px;object-fit:cover;border-radius:8px;cursor:pointer;background:#e5e7eb;flex:none}
.eg-vrow-t{flex:1;min-width:0}
.eg-vrow-t .tt{font-size:13.5px;font-weight:700;line-height:1.35;cursor:pointer;margin-bottom:4px;overflow-wrap:anywhere}
.eg-meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin-bottom:4px}
.eg-meta span{font-size:11px;background:#f1f5f9;color:#475569;border-radius:6px;padding:2px 6px;white-space:nowrap}
.eg-meta .lv{background:#fef3c7;color:#92400e}
.eg-meta .ok{background:#dcfce7;color:#166534;font-weight:700}
.eg-vnote{font-size:12px;color:#64748b;line-height:1.5;margin-bottom:6px}
.eg-vrow-acts{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.eg-vrow-acts button{border:1px solid #e2e8f0;background:#fff;border-radius:7px;padding:5px 9px;font-size:12px;cursor:pointer}
.eg-vrow-acts button.go{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:700}
.eg-vrow-acts select{border:1px solid #e2e8f0;background:#fff;border-radius:7px;padding:5px 6px;font-size:12px}
.eg-steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:10px 0 12px}
.eg-steps a{flex:none;min-width:72px;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 8px;font-size:12px;cursor:pointer;color:var(--txt)}
.eg-steps a b{display:block;font-size:11px;color:var(--muted);font-weight:600}
.eg-steps a.cur{border:2px solid #2563eb;background:#eff6ff}
.eg-steps a.fin{border-color:#86efac;background:#f0fdf4}
.eg-st-body{padding:0 14px 14px}
.eg-guide{margin:2px 0 10px;font-size:12.5px}
.eg-guide summary{cursor:pointer;color:#2563eb;font-weight:600}
.eg-vhead{max-width:820px;margin:10px auto 0;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.eg-vhead .tt{flex:1;min-width:200px;font-weight:700;font-size:14px;overflow-wrap:anywhere}
.eg-auto{max-width:820px;margin:10px auto 0;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.5}
.eg-card.fam{border:2px solid #22c55e;background:#f0fdf4}
.eg-card.todo{border:2px solid #60a5fa}
.eg-card .s2{padding:0 10px 9px;font-size:11px;color:#64748b;line-height:1.5}
.eg-day{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);margin:-6px 0 12px}
.eg-script{background:#f8fafc;border-radius:10px;padding:10px 12px;margin:2px 0 10px;font-size:12.5px;line-height:1.6}
.eg-sc-h{font-weight:800;font-size:12px;margin-top:8px;color:#334155}
.eg-sc-h:first-child{margin-top:0}
.eg-sc-p{color:#475569}
.eg-sc-ul{margin:2px 0;padding-left:16px;color:#475569}
.eg-sc-ph{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px}
.eg-sc-ph span{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:4px 8px;display:flex;flex-direction:column;gap:1px}
.eg-sc-ph b{font-size:12px;color:#1e40af}
.eg-sc-ph i{font-style:normal;font-size:10.5px;color:#94a3b8}
.eg-turn{position:fixed;inset:0;z-index:400;background:rgba(15,23,42,.88);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
.eg-turn.on{display:flex}
.eg-turn .msg{font-size:34px;font-weight:800;margin-bottom:14px}
.eg-turn .sen{font-size:clamp(22px,3.2vw,42px);font-weight:700;color:#fde68a;max-width:min(92vw,1000px);line-height:1.4;margin-bottom:22px;min-height:1em;overflow-wrap:anywhere}
.eg-turn .heard{font-size:18px;color:#cbd5e1;min-height:1.4em;margin-top:14px}
.eg-turn .heard b{color:#86efac}
.eg-mic{width:150px;height:150px;border-radius:50%;background:#ef4444;display:flex;align-items:center;justify-content:center;font-size:66px;box-shadow:0 0 0 0 rgba(239,68,68,.5);transition:box-shadow .08s linear}
.eg-mic.done{background:#22c55e}
.eg-mic.play{background:#3b82f6}
.eg-turn .row{display:flex;gap:12px;margin-top:26px}
.eg-turn .row button{border:none;border-radius:14px;padding:14px 20px;font-size:18px;font-weight:800;cursor:pointer}
.eg-turn .again{background:#fbbf24;color:#1f2733}
.eg-turn .next{background:#22c55e;color:#fff}
.eg-turn .quit{background:#475569;color:#fff}
.eg-burst{font-size:60px;min-height:72px;letter-spacing:6px}
@keyframes egPop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
.eg-burst.go{animation:egPop .55s ease-out}
.eg-stat{position:fixed;inset:0;z-index:500;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:14px}
.eg-stat.on{display:flex}
.eg-stat-box{background:var(--card);border-radius:16px;padding:16px;width:min(440px,100%);max-height:88vh;overflow:auto}
.eg-stat-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.eg-stat-hd b{flex:1;text-align:center;font-size:16px}
.eg-stat-hd button{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer}
.eg-stat-hd button:disabled{opacity:.3}
.eg-stat-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:11px;color:var(--muted);margin-bottom:10px}
.eg-stat-sum b{display:block;font-size:20px;color:var(--txt)}
.eg-stat-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.eg-stat-cal span{text-align:center;font-size:11px;color:var(--muted)}
.eg-stat-cal b{aspect-ratio:1;border-radius:8px;background:#f1f5f9;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:400;line-height:1.1}
.eg-stat-cal b u{text-decoration:none;font-size:10px;color:#94a3b8}
.eg-stat-cal b em{font-style:normal;font-size:13px;font-weight:800;color:#166534}
.eg-stat-cal b.s1{background:#dcfce7}
.eg-stat-cal b.s2{background:#86efac}
.eg-stat-cal b.t{outline:2px solid #2563eb}
.eg-stat-sec{font-size:13px;font-weight:800;margin:10px 0 4px}
.eg-stat-row{display:flex;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px solid #f1f5f9}
.eg-stat-row span{flex:1;min-width:0;overflow-wrap:anywhere}
.hd{padding:12px 18px}
.dist-foot{text-align:center;color:var(--muted);font-size:12px;padding:24px 0 40px}
</style></head><body>
<header><div class="hd"><h1>🗣 따라 말하기</h1><span class="today" id="today"></span>
<button class="rf" id="refresh" onclick="loadEng()">새로고침</button></div></header>
<div class="wrap"><div class="pane on" id="pane-eng"><div class="state">불러오는 중…</div></div>
<div class="dist-foot">아빠 도구함 · 기록은 이 사본에만 저장돼요</div></div>
<script>
var loaded={eng:false}, current="eng";
function p2(n){return ('0'+n).slice(-2);}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function busy(on){var b=document.getElementById("refresh");b.disabled=on;b.textContent=on?"불러오는 중…":"새로고침";}
function reloadCurrent(){ loadEng(); }
</script>
<script>
/* ── 🗣 아빠표영어 ──
   보기 / 따라 말하기(문장마다 멈춤 → 아이가 말함 → 아이 목소리 다시 들려주기 → 칭찬) /
   반복 / 문장 나누기. 문장 구간은 서버에 저장돼 두 폰이 같이 쓴다. */
var eg={data:null, vid:null, mode:'watch', player:null, pend:null, timer:null, rate:1,
  segs:[], units:[], sel:0, dirty:false, cutStart:0,
  rep:{n:3, speed:1, on:false, left:0, timer:null},
  say:{chunk:4, twice:false, back:true, stt:false, auto:true, idx:0, running:false, said:0, limit:10, start:0},
  phase:'', mic:null, rec:null, sr:null, ctx:null, audio:null, wake:null,
  recTimer:null, vadTimer:null, autoTimer:null, heardVoice:false, quietTries:0};

function egA(s){ return esc(String(s==null?'':s)).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function egFind(id){ return ((eg.data&&eg.data.videos)||[]).filter(function(v){ return v.id===id; })[0]; }
function egFmt(t){ t=Math.max(0,t||0); var m=Math.floor(t/60), s=(t-m*60).toFixed(1); return m+':'+(s<10?'0':'')+s; }

function loadEng(){
  busy(true);
  google.script.run.withSuccessHandler(function(d){
    eg.data=d; loaded.eng=true; busy(false);
    if(eg.vid){ var v=egFind(eg.vid.id); if(v) eg.vid=v; return; }   // 영상 화면은 그대로 둔다
    renderEngHome();
  }).withFailureHandler(function(e){
    document.getElementById('pane-eng').innerHTML='<div class="state">불러오기 실패: '+esc(e.message)+'</div>'; busy(false);
  }).eng_data();
}

/* 진도·정렬·지표 — 해본(익숙한) 영상이 앞, 새 영상은 뒤 */
function egProg(id){ return ((eg.data&&eg.data.prog)||{})[id]||{}; }
function egLearned(v){ return !!egProg(v.id).done; }
// 「해본 영상」 = 따라 말한 기록이 한 문장이라도 있는 것. 학습완료 버튼을 안 눌러도 기록으로 알아서 앞에 온다
function egPracticed(v){ var p=egProg(v.id); return (p.k||0)>0||!!p.done; }
function egLv(m){
  if(!m) return 0;
  var s=m.wpsent/2+m.wps*1.5+m.uniq/12+m.sec/100;   // 문장 길이 · 말 속도 · 어휘 수 · 영상 길이
  return s<6?1:s<8?2:s<10?3:s<14?4:5;
}
function egSc(v){ var m=v.m; return m?m.wpsent/2+m.wps*1.5+m.uniq/12+m.sec/100:99; }
function egSortVids(vs){
  return vs.slice().sort(function(a,b){
    var la=egPracticed(a), lb=egPracticed(b); if(la!==lb) return la?-1:1;   // 익숙한 영상이 맨 앞(최근에 한 순)
    if(la){ var da=egProg(a.id).d||'', db=egProg(b.id).d||''; if(da!==db) return db.localeCompare(da); return (egProg(b.id).k||0)-(egProg(a.id).k||0); }
    var sa=a.stage==null?9:a.stage, sb=b.stage==null?9:b.stage; if(sa!==sb) return sa-sb;
    return egSc(a)-egSc(b);
  });
}
function egMin(s){ s=Math.round(s||0); return Math.floor(s/60)+':'+p2(s%60); }
function egMeta(v){
  var m=v.m, h='<div class="eg-meta">';
  if(egPracticed(v)){ var pg=egProg(v.id);
    h+='<span class="ok">🔁 해봄 · '+(pg.k||0)+'문장'+(pg.d?' · '+esc(pg.d.slice(5)):'')+(pg.done?' · 끝까지':'')+'</span>'; }
  if(m){
    var lv=egLv(m);
    h+='<span>⏱ '+egMin(m.sec)+'</span><span>문장 '+m.n+'</span><span>단어 '+m.words+'</span><span>어휘 '+m.uniq+'종</span>'

/* 📊 월별 학습 현황 팝업 — 홈의 오늘/주간 별을 누르면 열린다 */
function egStats(ym){
  var d=eg.data||{}, today=d.today||'', log=d.log||{};
  ym=ym||today.slice(0,7);
  var y=Number(ym.slice(0,4)), m=Number(ym.slice(5,7));
  var mm=(d.logm||{})[ym];
  if(!mm&&!egStatsBusy){
    egStatsBusy=true;
    google.script.run.withSuccessHandler(function(r){
      egStatsBusy=false; d.logm=d.logm||{}; d.logm[ym]=(r&&r.m)||{}; egStats(ym);
    }).withFailureHandler(function(){ egStatsBusy=false; d.logm=d.logm||{}; d.logm[ym]={}; egStats(ym); }).eng_month(ym);
    mm={};
  }
  mm=mm||{};
  var first=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate(), total=0, active=0, best=0, cells='';
  for(var i=0;i<first;i++) cells+='<i></i>';
  for(var dd=1;dd<=days;dd++){
    var k=ym+'-'+p2(dd), n=log[k]||0; total+=n; if(n) active++; if(n>best) best=n;
    cells+='<b class="'+(n>=10?'s2':(n>0?'s1':''))+(k===today?' t':'')+'"><u>'+dd+'</u>'+(n?'<em>'+n+'</em>':'')+'</b>';
  }
  var vids=Object.keys(mm).map(function(id){ var v=egFind(id); return v?[v.title.split('|')[0].trim(),mm[id]]:null; })
    .filter(Boolean).sort(function(a,b){ return b[1]-a[1]; });
  var fin=((d.videos)||[]).filter(function(v){ var p=egProg(v.id); return p.done&&(p.d||'').slice(0,7)===ym; });
  var isNow=ym===today.slice(0,7), pm=new Date(y,m-2,1), nm=new Date(y,m,1);
  var pk=pm.getFullYear()+'-'+p2(pm.getMonth()+1), nk=nm.getFullYear()+'-'+p2(nm.getMonth()+1);
  var h='<div class="eg-stat-box" onclick="event.stopPropagation()">'
    +'<div class="eg-stat-hd"><button onclick="egStats(\''+pk+'\')">‹</button><b>'+y+'년 '+m+'월</b>'
    +'<button '+(isNow?'disabled':'onclick="egStats(\''+nk+'\')"')+'>›</button><button class="x" onclick="egStatsClose()">✕</button></div>'
    +'<div class="eg-stat-sum"><div><b>'+total+'</b>문장</div><div><b>'+active+'</b>일 함</div><div><b>'+(active?Math.round(total/active):0)+'</b>하루 평균</div><div><b>'+best+'</b>최고 하루</div></div>'
    +'<div class="eg-stat-cal"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>'+cells+'</div>'
    +'<div class="eg-stat-sec">🎬 이 달에 한 영상</div>'
    +(vids.length?vids.map(function(x){ return '<div class="eg-stat-row"><span>'+esc(x[0])+'</span><b>'+x[1]+'문장</b></div>'; }).join(''):'<div class="eg-note">영상별 기록은 이번 개편 이후부터 쌓여요.</div>')
    +'<div class="eg-stat-sec">✅ 이 달에 끝낸 영상 '+fin.length+'개</div>'
    +fin.map(function(v){ return '<div class="eg-stat-row"><span>'+esc(v.title.split('|')[0].trim())+'</span><b>'+esc((egProg(v.id).d||'').slice(5))+'</b></div>'; }).join('')
    +'<div class="eg-note">전체 학습: '+((d.videos||[]).filter(egLearned).length)+' / '+((d.videos||[]).length)+'개 영상 완료 · 문장 기록은 최근 120일까지 남아요</div></div>';
  var o=document.getElementById('egStat');
  if(!o){ o=document.createElement('div'); o.id='egStat'; o.className='eg-stat'; o.onclick=egStatsClose; document.body.appendChild(o); }
  o.innerHTML=h; o.classList.add('on');
}
var egStatsBusy=false;
function egStatsClose(){ var o=document.getElementById('egStat'); if(o) o.classList.remove('on'); }

/* ▶ 재생목록 — 안 한 영상을 쉬운 단계 순으로 이어서. 영상 첫 광고는 직접 건너뛰고 ▶ 시작 */
function egPlaylist(){
  var q=egSortVids((eg.data&&eg.data.videos)||[]).map(function(v){ return v.id; });   // 익숙한 영상 → 새 영상 순
  if(!q.length){ alert('영상이 없어요. 유튜브 링크를 먼저 추가해 주세요'); return; }
  eg.queue=q; eg.prevLimit=eg.say.limit; eg.say.limit=999;   // 재생목록은 영상 하나를 끝까지
  egOpen(q[0]);
}
function egQueueNext(){
  if(!eg.queue) return;
  var cur=eg.vid&&eg.vid.id, i=eg.queue.indexOf(cur), nx=null;
  for(var j=i+1;j<eg.queue.length;j++){ var v=egFind(eg.queue[j]); if(v){ nx=v.id; break; } }
  if(!nx){ alert('재생목록 끝! 오늘도 수고했어요 🌟'); renderEngHome(); return; }
  if(eg.dirty&&!confirm('나눈 문장을 저장하지 않았어요. 그냥 넘어갈까요?')) return;
  egOpen(nx);
}

function egAdd(){
  var u=document.getElementById('egUrl').value.trim(); if(!u) return;
  busy(true);
  google.script.run.withSuccessHandler(function(d){
    busy(false); if(d&&d.error){ alert(d.error); return; }
    eg.data=d; renderEngHome();
  }).withFailureHandler(function(e){ busy(false); alert('추가 실패: '+e.message); }).eng_addVideo(u);
}
function egDel(id){
  var v=egFind(id); if(!v||!confirm('「'+v.title+'」을(를) 지울까요?\n나눠둔 문장도 같이 지워져요.')) return;
  busy(true);
  google.script.run.withSuccessHandler(function(d){ busy(false); eg.data=d; renderEngHome(); })
    .withFailureHandler(function(e){ busy(false); alert(e.message); }).eng_delVideo(id);
}

function egScript(v){
  var r=EG_SCRIPT_RULES.filter(function(x){ return x.test.test(v.title||''); })[0];
  return r||EG_SCRIPT_RULES[EG_SCRIPT_RULES.length-1];
}
function egScriptHtml(v){
  var s=egScript(v), h='<div class="eg-script">';
  if(s.phrases.length){
    h+='<div class="eg-sc-h">🎯 목표 표현</div><div class="eg-sc-ph">'+s.phrases.map(function(p){
      return '<span><b>'+esc(p[0])+'</b><i>'+esc(p[1])+'</i></span>'; }).join('')+'</div>';
  }
  h+='<div class="eg-sc-h">▶️ 틀기 전</div><div class="eg-sc-p">'+esc(s.before)+'</div>';
  h+='<div class="eg-sc-h">👀 보는 중</div><ul class="eg-sc-ul">'+s.during.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>';
  h+='<div class="eg-sc-h">🙌 본 후 활동</div><div class="eg-sc-p">'+esc(s.after)+'</div>';
  h+='<div class="eg-sc-h">💡 반복 팁</div><div class="eg-sc-p">'+esc(s.tip)+'</div>';
  return h+'</div>';
}

var egOpenScript={};   // videoId → 지도안 펼침 여부
var egOpenStage={};    // 단계 → 펼침 여부(안 건드렸으면 「지금 단계」만 펼침)
function egToggleScript(id){ egOpenScript[id]=!egOpenScript[id]; egRoadmap(true); }
function egAssignStage(id, sel){
  var st=sel.value===''?null:Number(sel.value);
  busy(true);
  google.script.run.withSuccessHandler(function(d){ busy(false); eg.data=d; egRoadmap(true); })
    .withFailureHandler(function(e){ busy(false); alert(e.message); }).eng_setStage(id, st);
}
function egRoadmapAdd(stage){
  var inp=document.getElementById('egrAdd'+stage), u=inp.value.trim(); if(!u) return;
  egAddTo(u, stage);
}
function egAddTo(u, stage, after){
  busy(true);
  google.script.run.withSuccessHandler(function(d){
    busy(false); if(d&&d.error){ alert(d.error); return; }
    eg.data=d; if(after) after(); egRoadmap(true);
  }).withFailureHandler(function(e){ busy(false); alert('추가 실패: '+e.message); }).eng_addVideo(u, stage);
}
function egToggleDone(id, on){
  busy(true);
  google.script.run.withSuccessHandler(function(d){ busy(false); eg.data=d; if(eg.vid) egOpenHead(); else egRoadmap(true); })
    .withFailureHandler(function(e){ busy(false); alert(e.message); }).eng_setDone(id, on);
}
function egFind2(stage){ return egSortVids(((eg.data&&eg.data.videos)||[]).filter(function(v){ return v.stage===stage; })); }
// 지금 단계 = 아직 안 한 영상이 남은 가장 낮은 단계
function egCurStage(){
  var vs=(eg.data&&eg.data.videos)||[];
  for(var s=0;s<=5;s++){ if(vs.some(function(v){ return v.stage===s&&!egPracticed(v); })) return s; }
  return 0;
}
function egVideoRow(v){
  var open=!!egOpenScript[v.id], dn=egPracticed(v), id=egA(v.id);
  var h='<div class="eg-vrow'+(dn?' fam':'')+'">'
    +'<img loading="lazy" src="https://i.ytimg.com/vi/'+egA(v.yt)+'/default.jpg" alt="" '
    +'onerror="this.style.visibility=\'hidden\'" onclick="egOpen(\''+id+'\')">'
    +'<div class="eg-vrow-t"><div class="tt" onclick="egOpen(\''+id+'\')">'+esc(v.title)+'</div>'
    +egMeta(v)
    +(v.note?'<div class="eg-vnote">💬 '+esc(v.note)+'</div>':'')
    +'<div class="eg-vrow-acts">'
    +'<button class="go" onclick="egOpen(\''+id+'\')">'+(dn?'🔁 복습하기':'▶ 시작')+'</button>'
    +'<button onclick="egToggleScript(\''+id+'\')">'+(open?'▾ 지도안 닫기':'📋 지도안')+'</button>'
    +'<select onchange="egAssignStage(\''+id+'\',this)" onclick="event.stopPropagation()">'
    +[0,1,2,3,4,5].map(function(n){ var si=egStageInfo(n);
        return '<option value="'+n+'"'+(v.stage===n?' selected':'')+'>'+si.emoji+' '+n+'단계</option>'; }).join('')

function egStageJump(n){
  egOpenStage[n]=true; egRoadmap(true);
  var el=document.getElementById('egSt'+n); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function egRoadmap(keepScroll){
  var y=keepScroll?window.scrollY:0;
  var vs=(eg.data&&eg.data.videos)||[], cur=egCurStage();
  var h='<button class="eg-back" onclick="renderEngHome()">‹ 영상 목록</button>';
  h+='<div class="eg-rd-intro"><h3>🗺 바이링구얼 로드맵</h3>'
    +'<p>소리 → 몸 → 낱말 덩어리 → 이야기 → 말 걸기 → 일상 순서예요. <b>초록 테두리는 해본 영상</b>(익숙한 건 위로), 파란 테두리는 새 영상이에요. 따라 말한 기록으로 알아서 나뉘어요. '
    +'아이가 편하게 반응하면 다음 단계로 넘어가세요.</p>'
    +'<details class="eg-guide"><summary>왜 이 순서인가요? (부모 안내)</summary>'
    +'<p style="margin-top:6px">51개월 아이는 문법이 아니라 소리·리듬·반복으로 받아들이고, 이해가 말하기보다 한참 먼저 와요. '
    +'단계마다 영상은 <b>문장 길이·말 속도·어휘 수·길이</b>로 잰 언어 난이도가 낮은 것부터 나열했어요.</p>'
    +'<p class="eg-rd-note">⚠️ 영상만으로 균형 잡힌 이중언어가 되진 않아요. 5단계부터는 <b>일상에서 부모가 같은 표현을 반복해 쓰는 것</b>이 함께 필요해요.</p></details></div>';

  h+='<div class="eg-steps">'+EG_ROADMAP.map(function(s){
    var mine=vs.filter(function(v){ return v.stage===s.stage; }), dn=mine.filter(egPracticed).length;
    return '<a class="'+(s.stage===cur?'cur':(mine.length&&dn===mine.length?'fin':''))+'" onclick="egStageJump('+s.stage+')">'
      +s.emoji+' '+s.stage+'<b>'+dn+'/'+mine.length+'</b></a>';
  }).join('')+'</div>';

  EG_ROADMAP.forEach(function(s){
    var mine=egFind2(s.stage), dn=mine.filter(egPracticed).length;
    var open=egOpenStage[s.stage]!==undefined?egOpenStage[s.stage]:(s.stage===cur);
    h+='<details class="eg-st'+(s.stage===cur?' cur':'')+'" id="egSt'+s.stage+'"'+(open?' open':'')+' ontoggle="egOpenStage['+s.stage+']=this.open">'
      +'<summary><span class="eg-rd-emoji">'+s.emoji+'</span><div><div class="eg-rd-name">'+s.stage+'단계 · '+esc(s.name)
      +(s.stage===cur?' <span style="color:#2563eb;font-size:12px">← 지금 여기</span>':'')+'</div>'
      +'<div class="eg-rd-when">'+esc(s.when)+' · '+dn+'/'+mine.length+' 해봄</div>'
      +'<div class="bar"><i style="width:'+(mine.length?Math.round(dn/mine.length*100):0)+'%"></i></div></div>'
      +'<span class="chev"></span></summary><div class="eg-st-body">'
      +'<p class="eg-rd-goal">'+esc(s.goal)+'</p>'
      +'<details class="eg-guide"><summary>부모가 할 일 '+s.points.length+'가지</summary><ul class="eg-rd-pts">'
      +s.points.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+'</ul></details>';
    if(mine.length) h+='<div class="eg-vrows">'+mine.map(function(v){ return egVideoRow(v); }).join('')+'</div>';
    else h+='<div class="eg-rd-empty">아직 이 단계에 담은 영상이 없어요. 아래에 링크를 붙여 넣거나 Claude 에게 이 단계 영상을 찾아 달라고 하세요.</div>';
    h+='<div class="eg-rd-add" style="margin-top:10px"><input id="egrAdd'+s.stage+'" placeholder="직접 찾은 링크 붙여넣기" autocomplete="off">'
      +'<button onclick="egRoadmapAdd('+s.stage+')">이 단계에 담기</button></div></div></details>';
  });

  var un=egSortVids(vs.filter(function(v){ return v.stage==null; }));
  if(un.length){
    h+='<details class="eg-st" open><summary><span class="eg-rd-emoji">📦</span><div><div class="eg-rd-name">단계를 안 정한 영상</div><div class="eg-rd-when">'+un.length+'개</div></div></summary>'
      +'<div class="eg-st-body"><div class="eg-vrows">'+un.map(function(v){ return egVideoRow(v); }).join('')+'</div></div></details>';
  }
  document.getElementById('pane-eng').innerHTML=h;
  if(keepScroll) window.scrollTo(0,y);
}

/* 영상 화면 */
function egOpen(id){
  var v=egFind(id); if(!v) return;
  eg.vid=v; eg.segs=(v.segs||[]).map(function(q){ return q.slice(); });
  eg.mode=eg.segs.length?'say':'cut'; eg.sel=Math.min(egProg(v.id).nx||0, Math.max(0,eg.segs.length-1)); eg.dirty=false; eg.cutStart=0; eg.autoMsg='';
  document.getElementById('pane-eng').innerHTML=
    '<button class="eg-back" onclick="egBackHome()">‹ 영상 목록</button>'
    +'<div class="eg-pw"><div id="egPlayer"></div><div class="eg-pw-load" id="egLoad">'
    +'<div class="eg-spin"></div><div>영상을 불러오는 중…</div></div></div>'
    +'<div class="eg-vhead" id="egVhead"></div><div id="egAutoBox"></div>'
    +'<div class="eg-modes" id="egModes"></div><div class="eg-panel" id="egPanel"></div>';
  egOpenHead(); egMakePlayer(v.yt); egRenderMode();
  if(!eg.segs.length) egAutoChop();   // 챱은 자동 — 사람은 틀린 곳만 고친다
}
function egOpenHead(){
  var v=eg.vid&&egFind(eg.vid.id), b=document.getElementById('egVhead'); if(!v||!b) return;
  eg.vid=v;
  b.innerHTML='<div class="tt">'+esc(v.title)+egMeta(v)+'</div>'
    +'<button class="eg-btn" style="background:'+(egLearned(v)?'#6b7280':'#16a34a')+'" onclick="egToggleDone(\''+egA(v.id)+'\','+(egLearned(v)?'false':'true')+')">'
    +(egLearned(v)?'학습 취소':'✓ 학습함으로 표시')+'</button>'
    +(eg.queue?'<button class="eg-btn" style="background:#0f766e" onclick="egQueueNext()">⏭ 다음 영상 ('+(eg.queue.indexOf(v.id)+1)+'/'+eg.queue.length+')</button>':'');
}
// 자막으로 문장을 자동으로 나눠 바로 저장한다. quiet=true 면 실패해도 조용히 손 나누기 화면으로
function egAutoChop(){
  var box=document.getElementById('egAutoBox'), id=eg.vid.id;
  if(box) box.innerHTML='<div class="eg-auto">🪄 자막으로 문장을 자동으로 나누는 중… (5~10초)</div>';
  google.script.run.withSuccessHandler(function(d){
    if(!eg.vid||eg.vid.id!==id) return;
    box=document.getElementById('egAutoBox');
    if(d&&d.error){ eg.mode='say'; if(box) box.innerHTML='<div class="eg-auto" style="background:#fff7ed;border-color:#fed7aa;color:#9a3412">'+esc(d.error)+'</div>'; egRenderMode(); return; }
    eg.data=d; var v=egFind(id); if(v){ eg.vid=v; eg.segs=(v.segs||[]).map(function(q){ return q.slice(); }); }
    eg.sel=0; eg.dirty=false; eg.mode='say'; egOpenHead();
    if(box) box.innerHTML='<div class="eg-auto">🪄 자막으로 문장 <b>'+eg.segs.length+'개</b>를 자동으로 나눠 저장했어요. 어색한 곳만 <b>✂ 문장 나누기</b> 탭에서 고치세요.</div>';
    egRenderMode();
  }).withFailureHandler(function(e){
    box=document.getElementById('egAutoBox'); eg.mode='say';
    if(box) box.innerHTML='<div class="eg-auto" style="background:#fff7ed;border-color:#fed7aa;color:#9a3412">자동 나누기 실패: '+esc(e.message)+' — 그동안은 몇 초마다 멈추는 방식으로 쓸 수 있어요</div>';
    egRenderMode();
  }).eng_autoSegs(id);
}
function egLoadDone(msg){
  var l=document.getElementById('egLoad'); if(!l) return;
  if(msg) l.innerHTML='<div style="font-size:30px">😕</div><div>'+msg+'</div>'; else l.remove();
}
function egBackHome(){
  if(eg.dirty&&!confirm('나눈 문장을 저장하지 않았어요. 그냥 나갈까요?')) return;
  renderEngHome();
}

function egLoadApi(cb){
  if(window.YT&&YT.Player){ cb(); return; }
  eg.pend=cb;
  if(!document.getElementById('ytApi')){
    var s=document.createElement('script'); s.id='ytApi'; s.src='https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }
}
window.onYouTubeIframeAPIReady=function(){ if(eg.pend){ var f=eg.pend; eg.pend=null; f(); } };
function egMakePlayer(yt){
  egLoadApi(function(){
    if(!document.getElementById('egPlayer')) return;
    eg.player=new YT.Player('egPlayer',{ host:'https://www.youtube-nocookie.com', videoId:yt,
      playerVars:{ playsinline:1, rel:0, modestbranding:1, cc_load_policy:1, cc_lang_pref:'en', hl:'en', iv_load_policy:3 },
      events:{

        onError:function(){ egLoadDone('이 영상은 재생할 수 없어요<br><span style="opacity:.75;font-size:12px">(채널이 퍼가기를 막아둔 영상일 수 있어요)</span>'); }
      } });
  });
}
function egT(){ try{ return eg.player.getCurrentTime()||0; }catch(e){ return 0; } }
function egDur(){ try{ return eg.player.getDuration()||0; }catch(e){ return 0; } }

// s~e 초만 틀고 멈춘 뒤 done
function egPlaySeg(s,e,done){
  if(!eg.player||!eg.player.seekTo) return;
  clearInterval(eg.timer);
  try{ eg.player.setPlaybackRate(eg.rate||1); }catch(x){}
  eg.player.seekTo(s,true); eg.player.playVideo();
  eg.timer=setInterval(function(){
    if(egT()>=e-0.05){
      clearInterval(eg.timer); eg.timer=null;
      eg.player.pauseVideo(); if(done) done();
    }
  },40);
}

// 문장 구간이 없으면 N초씩 잘라 쓴다
function egUnits(){
  if(eg.segs.length) return eg.segs;
  var d=egDur(), out=[], c=eg.say.chunk;
  for(var t=0;t<d-0.5;t+=c) out.push([t,Math.min(d,t+c),'']);
  return out;
}

function egSegList(edit){

function egHiSeg(){

}
function egPick(i){ eg.sel=i; egHiSeg(); }
function egPrev(i){ var u=eg.segs.length?eg.segs:egUnits(); var q=u[i]; if(q){ eg.rate=1; egPlaySeg(q[0],q[1]); } }
function egSpeak(i){
  var u=eg.segs.length?eg.segs:egUnits(), q=u[i]; if(!q||!q[2]||!window.speechSynthesis) return;
  speechSynthesis.cancel();
  var s=new SpeechSynthesisUtterance(q[2]); s.lang='en-US'; s.rate=0.7; speechSynthesis.speak(s);

/* ✂ 문장 나누기 */
function egCutStartHere(){ eg.cutStart=Math.round(egT()*10)/10; alert(egFmt(eg.cutStart)+' 부터 첫 문장으로 칠게요'); }
function egCutHere(){
  if(!eg.player) return;
  var t=Math.round(egT()*10)/10;
  var last=eg.segs.length?eg.segs[eg.segs.length-1][1]:eg.cutStart;
  var s=(last<t)?last:Math.max(0,t-3);
  if(t-s<0.4) return;
  eg.segs.push([s,t,'']); eg.sel=eg.segs.length-1; eg.dirty=true;
  egRenderMode();
}
function egNudge(i,d){ var q=eg.segs[i]; q[1]=Math.max(q[0]+0.3,Math.round((q[1]+d)*10)/10); if(eg.segs[i+1]) eg.segs[i+1][0]=q[1]; eg.dirty=true; egRenderMode(); }
function egSegDel(i){ eg.segs.splice(i,1); eg.dirty=true; eg.sel=Math.max(0,Math.min(eg.sel,eg.segs.length-1)); egRenderMode(); }
function egCutReset(){ if(!confirm('나눈 문장을 모두 지울까요? (저장해야 반영돼요)')) return; eg.segs=[]; eg.cutStart=0; eg.dirty=true; egRenderMode(); }
function egAutoSegs(){
  if(eg.segs.length && !confirm('자막으로 자동 나누면 지금 나눈 문장을 덮어써요. 계속할까요?')) return;
  egAutoChop();
}
function egSaveSegs(){
  var id=eg.vid.id; busy(true);
  google.script.run.withSuccessHandler(function(d){
    busy(false); if(d&&d.error){ alert(d.error); return; }
    eg.data=d; eg.dirty=false; var v=egFind(id); if(v) eg.vid=v;

  }).withFailureHandler(function(e){ busy(false); alert('저장 실패: '+e.message); }).eng_saveSegs(id,eg.segs);
}

/* 🔁 반복 */
function egRepToggle(){
  if(eg.rep.on){ egStop(); egRenderMode(); return; }
  egUnlock();
  var u=egUnits(), q=u[eg.sel]; if(!q){ alert('영상이 아직 준비 안 됐어요. 잠깐 뒤에 다시 눌러 주세요.'); return; }

  document.getElementById('egRepBtn').textContent='■ 멈춤';
  (function loop(){
    if(!eg.rep.on) return;

      else { eg.rep.on=false; eg.rate=1; var b=document.getElementById('egRepBtn'); if(b) b.textContent='🔁 선택한 문장 반복'; }
    });
  })();
}

/* 🗣 따라 말하기 */
function egSR(){ return window.SpeechRecognition||window.webkitSpeechRecognition; }
function egAudio(){ if(!eg.audio){ eg.audio=new Audio(); eg.audio.setAttribute('playsinline',''); } return eg.audio; }
function egSilentWav(){
  var n=800, b=new ArrayBuffer(44+n), v=new DataView(b);
  var s=function(o,t){ for(var i=0;i<t.length;i++) v.setUint8(o+i,t.charCodeAt(i)); };
  s(0,'RIFF'); v.setUint32(4,36+n,true); s(8,'WAVE'); s(12,'fmt '); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,8000,true); v.setUint32(28,8000,true);
  v.setUint16(32,1,true); v.setUint16(34,8,true); s(36,'data'); v.setUint32(40,n,true);
  for(var i=0;i<n;i++) v.setUint8(44+i,128);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
// 아이폰은 첫 소리를 손가락 터치 안에서 내야 뒤에 이어지는 소리도 허락된다
function egUnlock(){
  var AC=window.AudioContext||window.webkitAudioContext;
  if(AC){ if(!eg.ctx) eg.ctx=new AC(); if(eg.ctx.state==='suspended') eg.ctx.resume(); }
  var a=egAudio(); if(!a.src){ a.src=egSilentWav(); a.play().catch(function(){}); }
  if(window.speechSynthesis){ var u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }
}
function egWake(on){
  try{
    if(on&&navigator.wakeLock&&!eg.wake) navigator.wakeLock.request('screen').then(function(w){ eg.wake=w; }).catch(function(){});
    if(!on&&eg.wake){ eg.wake.release(); eg.wake=null; }
  }catch(e){}
}

function egOv(){
  var o=document.getElementById('egTurn');
  if(!o){
    o=document.createElement('div'); o.className='eg-turn'; o.id='egTurn';
    o.innerHTML='<div class="eg-burst" id="egBurst"></div><div class="msg" id="egMsg"></div><div class="sen" id="egSen"></div>'
      +'<div class="eg-mic" id="egMic">🎤</div><div class="heard" id="egHeard"></div>'
      +'<div class="row"><button class="again" onclick="egAgain()">🔁 한 번 더</button>'
      +'<button class="next" id="egNextBtn" onclick="egNext()">다 했어 ➡</button></div>'
      +'<div class="row"><button class="quit" onclick="egSayStop()">그만하기</button></div>';
    document.body.appendChild(o);
  }
  return o;
}
function egOvSet(o){
  if(o.msg!=null) document.getElementById('egMsg').textContent=o.msg;
  if(o.sen!=null) document.getElementById('egSen').textContent=o.sen;
  if(o.heard!=null) document.getElementById('egHeard').innerHTML=o.heard;
  if(o.burst!=null){ var b=document.getElementById('egBurst'); b.textContent=o.burst; b.classList.remove('go'); void b.offsetWidth; if(o.burst) b.classList.add('go'); }
  if(o.mic!=null){ var m=document.getElementById('egMic'); m.className='eg-mic'+(o.mic?' '+o.mic:''); m.textContent=o.mic==='play'?'🔊':(o.mic==='done'?'👍':'🎤'); m.style.boxShadow=''; }
}
function egOvHide(){ var o=document.getElementById('egTurn'); if(o) o.classList.remove('on'); }

function egSayStart(){
  egUnlock();
  var u=egUnits();
  if(!u.length){ alert('영상이 아직 준비 안 됐어요. 잠깐 뒤에 다시 눌러 주세요.'); return; }
  eg.units=u; eg.say.running=true; eg.say.idx=Math.min(eg.sel,u.length-1); eg.say.start=eg.say.idx; eg.quietTries=0; eg.rate=1;
  egWake(true); egSayStep();
}
function egSayStep(){
  if(!eg.say.running) return;
  var u=eg.units[eg.say.idx];
  if(!u){ egSayStop(true); return; }
  if(eg.say.idx-eg.say.start>=eg.say.limit){ eg.sel=eg.say.idx; egSayStop(false,true); return; }   // 오늘 분량 끝 — 지루해지기 전에 멈춘다
  eg.sel=eg.say.idx; egHiSeg(); egOvHide(); eg.phase='listen';
  var play=function(k){
    egPlaySeg(u[0],u[1],function(){
      if(!eg.say.running) return;
      if(k>1) eg.autoTimer=setTimeout(function(){ play(k-1); },600);
      else egTurnMic(u);
    });
  };
  play(eg.say.twice?2:1);
}
function egTurnMic(u){
  egOv().classList.add('on');
  var tot=Math.min(eg.say.limit,eg.units.length-eg.say.start);
  egOvSet({msg:'따라 해 봐! 🎤 ('+(eg.say.idx-eg.say.start+1)+'/'+tot+')', sen:u[2]||'', heard:'', burst:'', mic:''});
  document.getElementById('egNextBtn').textContent='다 했어 ➡';
  if(eg.say.stt&&egSR()) egListenSTT(u); else egRecord(u);
}

function egRecord(u){
  eg.phase='rec';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){
    eg.phase='noRec'; egOvSet({heard:'이 기기에선 녹음이 안 돼요 — 따라 말하면 「다 했어」를 눌러 주세요'}); return;
  }
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(function(st){
    if(!eg.say.running||eg.phase!=='rec'){ st.getTracks().forEach(function(t){ t.stop(); }); return; }
    eg.mic=st;
    var mt=['audio/mp4','audio/webm;codecs=opus','audio/webm'].filter(function(m){
      return MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m); })[0];
    var rec=new MediaRecorder(st, mt?{mimeType:mt}:undefined), chunks=[];
    eg.rec=rec;
    rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onstop=function(){
      var spoke=eg.heardVoice;
      egMicOff();
      egAfterRec(u, new Blob(chunks,{type:rec.mimeType||mt||'audio/mp4'}), spoke);
    };
    rec.start();
    egVad(st);
    eg.recTimer=setTimeout(egRecStop,8000);
  }).catch(function(){
    eg.phase='noRec'; egOvSet({heard:'마이크를 쓸 수 없어요 — 허용해 주세요. 따라 말하면 「다 했어」를 눌러 주세요'});
  });
}
// 목소리 크기로 마이크를 부풀리고, 말이 끝나면(1.3초 조용) 알아서 멈춘다
function egVad(st){
  eg.heardVoice=false;
  if(!eg.ctx) return;
  if(eg.ctx.state==='suspended') eg.ctx.resume();
  var src=eg.ctx.createMediaStreamSource(st), an=eg.ctx.createAnalyser(); an.fftSize=512; src.connect(an);
  eg.vadSrc=src;
  var buf=new Uint8Array(an.fftSize), quiet=0, t0=Date.now(), mic=document.getElementById('egMic');
  clearInterval(eg.vadTimer);
  eg.vadTimer=setInterval(function(){
    an.getByteTimeDomainData(buf);
    var sum=0; for(var i=0;i<buf.length;i++){ var v=(buf[i]-128)/128; sum+=v*v; }
    var rms=Math.sqrt(sum/buf.length), now=Date.now();
    if(mic) mic.style.boxShadow='0 0 0 '+Math.min(70,Math.round(rms*500))+'px rgba(239,68,68,.35)';
    if(rms>0.035&&now-t0>300){ eg.heardVoice=true; quiet=0; }
    else if(eg.heardVoice){ if(!quiet) quiet=now; else if(now-quiet>1300) egRecStop(); }
    else if(now-t0>5000) egRecStop();
  },60);
}
function egRecStop(){
  clearTimeout(eg.recTimer); clearInterval(eg.vadTimer);
  if(eg.sr){ try{ eg.sr.stop(); }catch(e){} }
  if(eg.rec&&eg.rec.state!=='inactive'){ try{ eg.rec.stop(); }catch(e){} }
}
function egMicOff(){
  clearInterval(eg.vadTimer);
  if(eg.vadSrc){ try{ eg.vadSrc.disconnect(); }catch(e){} eg.vadSrc=null; }
  if(eg.mic){ eg.mic.getTracks().forEach(function(t){ t.stop(); }); eg.mic=null; }   // 마이크를 꺼야 영상 소리가 다시 커진다
  eg.rec=null;
}

function egAfterRec(u, blob, spoke){
  if(!eg.say.running||eg.phase!=='rec') return;
  if(!spoke){
    eg.phase='quiet'; eg.quietTries++;
    egOvSet({msg:eg.quietTries>=2?'다음 문장으로 가 볼까?':'다시 들어볼까? 👂', heard:'', mic:''});
    eg.autoTimer=setTimeout(function(){
      if(eg.phase!=='quiet'||!eg.say.running) return;
      if(eg.quietTries>=2) egAdvance(); else egSayStep();
    },1400);
    return;
  }
  eg.quietTries=0;
  if(eg.say.back&&blob&&blob.size){
    eg.phase='play'; egOvSet({msg:'내 목소리! 🔊', mic:'play'});
    var a=egAudio(), url=URL.createObjectURL(blob);
    a.onended=function(){ URL.revokeObjectURL(url); if(eg.phase==='play') egDone(); };
    a.src=url; a.play().catch(function(){ if(eg.phase==='play') egDone(); });
  } else egDone();
}

var EG_PRAISE=['Great job!','Wonderful!','Good job!','Yay!','Awesome!','Super!','Well done!'];
var EG_BURST=['🌟🌟🌟','🎉⭐🎉','👏👏👏','🦄✨🌈','🐷💕🐷','🚀⭐🚀'];
function egDone(){
  if(!eg.say.running) return;
  eg.phase='praise';
  egOvSet({msg:'잘했어!', mic:'done', burst:EG_BURST[Math.floor(Math.random()*EG_BURST.length)]});
  if(window.speechSynthesis){
    speechSynthesis.cancel();
    var s=new SpeechSynthesisUtterance(EG_PRAISE[Math.floor(Math.random()*EG_PRAISE.length)]);
    s.lang='en-US'; s.rate=0.95; s.pitch=1.3; speechSynthesis.speak(s);
  }
  eg.say.said++;
  google.script.run.withSuccessHandler(function(r){
    if(eg.data&&r){ eg.data.log=r.log; eg.data.logv=r.logv; eg.data.prog=r.prog; eg.data.logm=r.logm; if(eg.vid) egOpenHead(); }
  }).eng_logSay(1, eg.vid.id, eg.say.idx, eg.units.length);
  document.getElementById('egNextBtn').textContent='다음 ➡';
  if(eg.say.auto) eg.autoTimer=setTimeout(function(){ if(eg.phase==='praise') egAdvance(); },2400);
}
function egAdvance(){ clearTimeout(eg.autoTimer); eg.say.idx++; eg.quietTries=0; egSayStep(); }
function egCancelTurn(){
  clearTimeout(eg.autoTimer); clearTimeout(eg.recTimer); clearInterval(eg.timer);
  var was=eg.phase; eg.phase='cancel';
  if(was==='rec') egRecStop();
  egMicOff();
  if(eg.audio){ try{ eg.audio.pause(); }catch(e){} }
  if(window.speechSynthesis) speechSynthesis.cancel();
}
function egNext(){
  if(eg.phase==='rec'){ egRecStop(); return; }     // 말이 끝났다 → 들려주기로
  if(eg.phase==='noRec'){ egDone(); return; }
  egCancelTurn(); egAdvance();
}
function egAgain(){ egCancelTurn(); eg.quietTries=0; egSayStep(); }

function egSayStop(finished, roundEnd){
  var said=eg.say.said, was=eg.say.running;
  eg.say.running=false; egCancelTurn(); egOvHide(); egWake(false);
  try{ if(eg.player&&eg.player.pauseVideo) eg.player.pauseVideo(); }catch(e){}
  if(was&&finished&&eg.queue){
    var bx=document.getElementById('egAutoBox');
    if(bx) bx.innerHTML='<div class="eg-auto">✅ 끝까지 했어요('+said+'문장)! 다음 영상으로 넘어가요 — 광고가 나오면 직접 건너뛰고 ▶ 시작</div>';
    eg.say.said=0; setTimeout(egQueueNext,1800); return;
  }
  if(was&&said){
    var lr=eg.vid&&egLearned(eg.vid);
    alert((finished?'끝까지 했어요! ':(roundEnd?'오늘 분량 끝! ':''))+'이번에 '+said+'문장 따라 말했어요 🌟'
      +(lr?'\n✅ 이 영상은 학습 완료로 표시됐어요':(roundEnd?'\n다음엔 '+(eg.say.idx+1)+'번 문장부터 이어서 해요':'')));
  }
  eg.say.said=0;
}

// 받아쓰기(베타) — 아이 발음은 잘 못 알아들어서 기본은 끔
function egListenSTT(u){
  eg.phase='rec';
  var SR=egSR(), r=new SR(), got='', ended=false;
  r.lang='en-US'; r.interimResults=true; r.maxAlternatives=1; eg.sr=r;
  r.onresult=function(e){
    got=''; for(var i=0;i<e.results.length;i++) got+=e.results[i][0].transcript+' ';
    egOvSet({heard:egMatch(got,u[2])});
  };
  r.onerror=function(){};
  r.onend=function(){
    if(ended) return; ended=true; eg.sr=null; clearTimeout(eg.recTimer);
    if(eg.phase!=='rec'||!eg.say.running) return;
    if(got.trim()) egDone(); else egAfterRec(u,null,false);
  };
  try{ r.start(); }catch(e){ egRecord(u); return; }
  eg.recTimer=setTimeout(function(){ try{ r.stop(); }catch(e){} },6000);
}
function egMatch(got,target){
  var want={}; (target||'').toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).forEach(function(w){ if(w) want[w]=1; });
  return got.trim().split(/\s+/).map(function(w){
    var k=w.toLowerCase().replace(/[^a-z']/g,'');
    return want[k]?'<b>'+esc(w)+'</b>':esc(w);
  }).join(' ');
}

// 탭을 떠나거나 모드를 바꿀 때 전부 멈춘다
function egStop(){
  if(eg.say.running) egSayStop();
  egCancelTurn(); egOvHide();
  eg.rep.on=false; clearTimeout(eg.rep.timer); eg.rate=1;
  try{ if(eg.player&&eg.player.pauseVideo) eg.player.pauseVideo(); }catch(e){}
}
